name: Bug report
description: Report a crash, failed operation, or unexpected ArchOxide behavior.
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installed packages
        - Repository search or transactions
        - AUR search or transactions
        - Package updates
        - Navigation or layout
        - Settings or Kitty
        - Build or tests
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the view, keys you pressed, and package names or sources where relevant.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share the ArchOxide version or commit, Linux distribution, and terminal. Include the pacman or yay version for package issues.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Share relevant error output or screenshots with private information removed.
