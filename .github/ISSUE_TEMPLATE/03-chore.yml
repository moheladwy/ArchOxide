name: Maintenance task
description: Propose a refactor, dependency update, test improvement, or CI change.
body:
  - type: textarea
    id: task
    attributes:
      label: Task and motivation
      description: Describe what should change and what problem it would address.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe how a reviewer can tell the task is complete.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Affected files or related work
      description: Link relevant files, logs, issues, or pull requests.
