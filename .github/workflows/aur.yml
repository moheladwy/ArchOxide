name: Arch package

on:
    pull_request:
        branches: [main]
        paths:
            - src/**
            - tests/**
            - Cargo.toml
            - Cargo.lock
            - PKGBUILD
            - .SRCINFO
            - LICENSE
            - .github/workflows/**
    push:
        branches: [main]
        paths:
            - src/**
            - tests/**
            - Cargo.toml
            - Cargo.lock
            - PKGBUILD
            - .SRCINFO
            - LICENSE
            - .github/workflows/**
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build and test Arch package
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        container: archlinux:base-devel
        defaults:
            run:
                shell: bash
        outputs:
            sync_aur: ${{ steps.changes.outputs.sync_aur }}
        steps:
            - name: Install build dependencies
              run: pacman -Syu --noconfirm --needed git rust sudo

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check whether the AUR recipe needs syncing
              id: changes
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  case "$GITHUB_EVENT_NAME" in
                      workflow_dispatch) sync_aur=true ;;
                      push)
                          repo=(git -C "$GITHUB_WORKSPACE" -c safe.directory="$GITHUB_WORKSPACE")
                          if "${repo[@]}" cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                              changed=$("${repo[@]}" diff --name-only "$PUSH_BEFORE" HEAD -- \
                                  PKGBUILD .SRCINFO LICENSE .github/workflows/aur.yml)
                              sync_aur=false
                              if [[ -n "$changed" ]]; then
                                  sync_aur=true
                              fi
                          else
                              sync_aur=true
                          fi
                          ;;
                      *) sync_aur=false ;;
                  esac
                  printf 'sync_aur=%s\n' "$sync_aur" >> "$GITHUB_OUTPUT"

            - name: Run makepkg and verify the archive
              run: |
                  useradd --create-home builder
                  build_dir=$(mktemp -d)
                  # Seed makepkg's Git cache with the revision under test, including PR merge commits.
                  git -c safe.directory="$GITHUB_WORKSPACE" clone --bare --no-local \
                      "$GITHUB_WORKSPACE" "$build_dir/archoxide"
                  git -C "$build_dir/archoxide" update-ref refs/heads/main "$GITHUB_SHA"
                  chown -R builder:builder "$build_dir/archoxide"
                  chown builder:builder "$build_dir"
                  install -m 644 -o builder -g builder PKGBUILD .SRCINFO "$build_dir/"
                  runuser -u builder -- bash -euo pipefail -s -- "$build_dir" "$GITHUB_SHA" <<'BUILD'
                      cd "$1"
                      makepkg --printsrcinfo | diff -u .SRCINFO -
                      makepkg --noconfirm --holdver
                      test "$(git -C src/archoxide rev-parse HEAD)" = "$2"
                      shopt -s nullglob
                      archives=(archoxide-git-r*-x86_64.pkg.tar.zst)
                      test "${#archives[@]}" -eq 1
                      bsdtar -xOf "${archives[0]}" usr/bin/archoxide > archoxide-check
                      chmod +x archoxide-check
                      ./archoxide-check --help
                  BUILD
                  mkdir -p dist
                  install -m 644 "$build_dir"/archoxide-git-r*-x86_64.pkg.tar.zst dist/

            - name: Upload Arch package
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: archoxide-git-x86_64
                  path: dist/*.pkg.tar.zst
                  if-no-files-found: error

    release:
        name: Publish Arch package download
        needs: build
        if: github.repository == 'moheladwy/ArchOxide' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        concurrency:
            group: arch-release-${{ github.sha }}
            cancel-in-progress: false
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: archoxide-git-x86_64
                  path: dist

            - name: Publish the built version to GitHub Releases
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  shopt -s nullglob
                  archives=(dist/archoxide-git-r*-x86_64.pkg.tar.zst)
                  test "${#archives[@]}" -eq 1
                  archive_name=${archives[0]##*/}
                  tag=${archive_name%-x86_64.pkg.tar.zst}
                  if release=$(gh release view "$tag" --json isDraft,assets 2>/dev/null); then
                      if jq -e '.isDraft' <<< "$release" >/dev/null; then
                          gh release upload "$tag" "${archives[0]}" --clobber
                          gh release edit "$tag" --draft=false
                      else
                          jq -e --arg name "$archive_name" 'any(.assets[]; .name == $name)' \
                              <<< "$release" >/dev/null
                          echo "The package for $tag is already published."
                      fi
                  else
                      gh release create "$tag" "${archives[0]}" --prerelease \
                          --target "$GITHUB_SHA" --title "$tag" \
                          --notes "Arch Linux x86_64 package built and tested from commit $GITHUB_SHA."
                  fi

    publish:
        name: Publish archoxide-git to the AUR
        needs: build
        if: >-
            github.repository == 'moheladwy/ArchOxide' &&
            github.ref == 'refs/heads/main' &&
            needs.build.outputs.sync_aur == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        concurrency:
            group: aur-publish
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Push packaging files
              env:
                  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
              run: |
                  git fetch --no-tags origin refs/heads/main
                  changed=$(git diff --name-only HEAD FETCH_HEAD -- PKGBUILD .SRCINFO LICENSE)
                  if [[ -n "$changed" ]]; then
                      echo 'A newer packaging change is already on main.'
                      exit 0
                  fi

                  if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
                      echo 'The AUR_SSH_PRIVATE_KEY repository secret is required.' >&2
                      exit 1
                  fi
                  umask 077
                  publish_dir=$(mktemp -d)
                  trap 'rm -rf -- "$publish_dir"' EXIT
                  printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > "$publish_dir/identity"
                  unset AUR_SSH_PRIVATE_KEY
                  if ! ssh-keygen -y -P '' -f "$publish_dir/identity" >/dev/null 2>&1; then
                      echo 'AUR_SSH_PRIVATE_KEY must contain the complete SSH private key with its original line breaks and no passphrase.' >&2
                      exit 1
                  fi
                  # Ed25519 key verified against https://archlinux.org/news/aur-migration-new-ssh-hostkeys/.
                  printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$publish_dir/known_hosts"
                  export GIT_SSH_COMMAND="ssh -i '$publish_dir/identity' -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$publish_dir/known_hosts'"

                  git -c init.defaultBranch=master clone -- ssh://aur@aur.archlinux.org/archoxide-git.git "$publish_dir/repo"
                  install -m 644 PKGBUILD .SRCINFO LICENSE "$publish_dir/repo/"
                  cd "$publish_dir/repo"
                  git add -- PKGBUILD .SRCINFO LICENSE
                  if git diff --cached --quiet; then
                      echo 'The AUR is up to date.'
                      exit 0
                  fi
                  git -c user.name='ArchOxide CI' -c user.email='59349012+moheladwy@users.noreply.github.com' \
                      commit -m "Sync ArchOxide packaging from ${GITHUB_SHA::7}"
                  git push origin HEAD:refs/heads/master
