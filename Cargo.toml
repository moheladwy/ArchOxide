[package]
name = "archoxide"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
freedesktop-desktop-entry = { version = "0.8.4", default-features = false }
libc = "0.2.191"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.2.3"
tui-term = "0.3.4"
unicode-segmentation = "1.13.3"
